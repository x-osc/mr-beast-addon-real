name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew build -Pmod_version="${GITHUB_REF_NAME#v}"
          else
            ./gradlew build -Pversion_suffix=-nightly
          fi

      - name: minecraft version
        id: mc
        run: |
          MC=$(grep -E '^minecraft\s*=' gradle/libs.versions.toml | head -n1 | cut -d'"' -f2)
          test -n "$MC" || { echo "Couldn't read the Minecraft version"; exit 1; }
          echo "version=$MC" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: addon
          path: |
            build/libs/*.jar

      - name: tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          MC: ${{ steps.mc.outputs.version }}
        run: |
          gh release create "$TAG" \
            $(ls build/libs/*.jar) \
            --title "$TAG (for $MC)" \
            --generate-notes

      - name: prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          MC: ${{ steps.mc.outputs.version }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            $(ls build/libs/*.jar) \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "latest prerelease (for $MC)" \
            --notes "Automated build of ${GITHUB_SHA::7}: $COMMIT_MSG"
